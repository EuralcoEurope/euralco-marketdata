name: Aluminiumkoers bijwerken

on:
  schedule:
    # Twee regels, want GitHub rekent in UTC. De controlestap hieronder laat per run
    # alleen de regel door die bij de huidige NL-tijd hoort (zomer of winter).
    - cron: '5 6-19 * * 1-5'   # zomertijd (UTC+2): elk uur 08:05-21:05 NL
    - cron: '5 7-20 * * 1-5'   # wintertijd (UTC+1): elk uur 08:05-21:05 NL
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: koers
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.tijd.outputs.run }}
    steps:
      - name: Hoort deze run bij de huidige NL-tijd?
        id: tijd
        env:
          EVENT: ${{ github.event_name }}
          SCHEDULE: ${{ github.event.schedule }}
        run: |
          OFFSET=$(TZ=Europe/Amsterdam date +%z)
          RUN=false
          if [ "$EVENT" != "schedule" ]; then RUN=true; fi
          if [ "$SCHEDULE" = "5 6-19 * * 1-5" ] && [ "$OFFSET" = "+0200" ]; then RUN=true; fi
          if [ "$SCHEDULE" = "5 7-20 * * 1-5" ] && [ "$OFFSET" = "+0100" ]; then RUN=true; fi
          echo "event=$EVENT schedule=$SCHEDULE offset=$OFFSET run=$RUN"
          echo "run=$RUN" >> "$GITHUB_OUTPUT"

  update:
    needs: plan
    if: needs.plan.outputs.run == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Koers ophalen
        env:
          METALPRICEAPI_KEY: ${{ secrets.METALPRICEAPI_KEY }}
        run: node scripts/update.mjs
      - name: Opslaan in repository
        run: |
          git config user.name "koers-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/aluminium.json
          git diff --cached --quiet || git commit -m "Koersupdate $(date -u +%FT%RZ)"
          git push
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - id: deploy
        uses: actions/deploy-pages@v4
