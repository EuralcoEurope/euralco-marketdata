name: Aluminiumkoers bijwerken

on:
  schedule:
    - cron: '7 5-19 * * 1-5'   # elk uur, ma-vr, 07:07-21:07 NL-zomertijd
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: koers
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Koers ophalen
        env:
          METALPRICEAPI_KEY: ${{ secrets.METALPRICEAPI_KEY }}
        run: node scripts/update.mjs
      - name: Opslaan in repository
        run: |
          git config user.name "koers-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/aluminium.json
          git diff --cached --quiet || git commit -m "Koersupdate $(date -u +%FT%RZ)"
          git push
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - id: deploy
        uses: actions/deploy-pages@v4
